[package]
name = "ecsh"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-credential-types = "1.3.0"
aws-sdk-cloudwatchlogs = { version = "1.154.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ecs = { version = "1.148.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sso = { version = "1.113.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
indicatif = "0.18.6"
inquire = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.6"
unicode-width = "0.2.2"
