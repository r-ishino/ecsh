[package]
name = "ecsh"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-ecs = "1.148.0"
clap = { version = "4.6.7", features = ["derive"] }
inquire = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "1.1.6"
